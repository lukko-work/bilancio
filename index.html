<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bilancio</title>
  <meta name="description" content="I tuoi conti, solo sul tuo telefono.">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bilancio">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="vista"></main>

  <nav class="tabbar" id="tabbar">
    <button data-vista="movimenti"><span class="ti">☰</span>Movimenti</button>
    <button data-vista="riepilogo"><span class="ti">◔</span>Riepilogo</button>
    <button data-vista="importa"><span class="ti">⇩</span>Importa</button>
    <button data-vista="altro"><span class="ti">⋯</span>Altro</button>
  </nav>

  <div class="velo" id="velo" hidden></div>
  <section class="sheet" id="sheet" hidden></section>
  <div class="toast" id="toast" hidden></div>

  <input type="file" id="file-estratto" accept=".xlsx,.xls,.csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input type="file" id="file-backup" accept=".json,application/json" hidden>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
